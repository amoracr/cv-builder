services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: job_automation_bot
    volumes:
      - ./backend:/app
      - ./backend/data:/app/data
    env_file:
      - .env
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DB_PATH=/app/data/cv_builder.db
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
