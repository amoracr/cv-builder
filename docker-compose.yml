services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
      args:
        - LLM_ENGINE=${LLM_ENGINE}
    container_name: job_automation_bot
    volumes:
      - ./backend:/app
      - ./backend/data:/app/data
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    command: uvicorn main:app --host 0.0.0.0 --port ${BACKEND_PORT:-8000} --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: job_automation_frontend
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    env_file:
        - .env
    ports:
      - "${FRONTEND_PORT:-5173}:${FRONTEND_PORT:-5173}"
    environment:
      - VITE_PORT=${FRONTEND_PORT:-5173}
      - VITE_BACKEND_URL=${VITE_BACKEND_URL:-http://localhost:8000}
    command: npm run dev -- --host 0.0.0.0 --port ${FRONTEND_PORT:-5173}

volumes:
  frontend_node_modules: