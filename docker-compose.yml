services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: job_automation_bot
    restart: always
    volumes:
      - ./backend:/app
      - ./backend/data:/app/data
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DB_PATH=/app/data/cv_builder.db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
